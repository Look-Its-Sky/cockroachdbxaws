# Required deployment identity. The JSON schema rejects empty production values.
region: ""
tenantID: ""
classification: SENSITIVE
redactionPolicy: baseline-v1
allowedServices: []
allowedEnvironments: []

image:
  repository: ""
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

database:
  # Created outside this chart. The key must contain a provider-issued TLS DSN.
  existingSecret: static-log-analysis-database
  dsnKey: dsn

tls:
  # analysisServer: tls.crt, tls.key, ca.crt (CA that signed Collector clients)
  analysisServerSecret: static-log-analysis-server-tls
  # collectorServer: tls.crt, tls.key, ca.crt (CA that signed project clients)
  collectorServerSecret: static-log-analysis-collector-server-tls
  # collectorClient: tls.crt, tls.key, ca.crt (CA that signed analysis server)
  collectorClientSecret: static-log-analysis-collector-client-tls
  # Defaults to the Helm release's generated analysis Service name.
  analysisServerName: ""

analysis:
  replicas: 1
  journal:
    storageClass: ""
    size: 20Gi
    maxBytes: 16106127360
    minFreeBytes: 2147483648
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  extraArgs: []

outbox:
  replicas: 2
  queueURL: ""
  deadLetterQueueURL: ""
  serviceAccount:
    create: true
    name: static-log-analysis-outbox
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  extraArgs: []

cloudwatch:
  # Enable only after configuring exact sources and the matching Terraform IAM
  # inputs. One replica owns each configured group set and its two local PVCs.
  enabled: false
  replicas: 1
  accountID: ""
  credentialIdentity: ""
  sources: []
  serviceAccount:
    create: true
    name: static-log-analysis-cloudwatch
    annotations: {}
  journal:
    storageClass: ""
    size: 20Gi
    maxBytes: 16106127360
    minFreeBytes: 2147483648
  checkpoints:
    storageClass: ""
    size: 1Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  extraArgs: []

collector:
  replicas: 1
  image:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
    tag: 0.157.0
    digest: sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6
    pullPolicy: IfNotPresent
  queue:
    storageClass: ""
    size: 10Gi
    sizeRecords: 10000
  service:
    type: ClusterIP
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

volumePermissions:
  image: alpine:3.23@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
