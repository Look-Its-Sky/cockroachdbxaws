apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "static-log-analysis.fullname" . }}-collector
  labels:
    {{- include "static-log-analysis.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  serviceName: {{ include "static-log-analysis.fullname" . }}-collector
  replicas: {{ .Values.collector.replicas }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "static-log-analysis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        {{- include "static-log-analysis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: collector
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/collector-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: queue-permissions
          image: {{ .Values.volumePermissions.image | quote }}
          command: ["/bin/sh", "-ec", "chown -R 10001:10001 /queue"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: queue
              mountPath: /queue
      containers:
        - name: collector
          image: {{ include "static-log-analysis.collectorImage" . | quote }}
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: queue
              mountPath: /var/lib/otelcol/queue
            - name: server-tls
              mountPath: /tls/server
              readOnly: true
            - name: client-tls
              mountPath: /tls/client
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "static-log-analysis.fullname" . }}-collector
        - name: server-tls
          secret:
            secretName: {{ .Values.tls.collectorServerSecret }}
            defaultMode: 0400
        - name: client-tls
          secret:
            secretName: {{ .Values.tls.collectorClientSecret }}
            defaultMode: 0400
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: queue
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.collector.queue.storageClass }}
        storageClassName: {{ .Values.collector.queue.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.collector.queue.size }}
