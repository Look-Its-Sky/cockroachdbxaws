{{- if .Values.outbox.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "static-log-analysis.outboxServiceAccount" . }}
  labels:
    {{- include "static-log-analysis.labels" . | nindent 4 }}
    app.kubernetes.io/component: outbox
  {{- with .Values.outbox.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}

