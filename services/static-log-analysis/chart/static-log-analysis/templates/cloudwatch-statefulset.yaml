{{- if .Values.cloudwatch.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "static-log-analysis.fullname" . }}-cloudwatch
  labels:
    {{- include "static-log-analysis.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloudwatch
spec:
  serviceName: {{ include "static-log-analysis.fullname" . }}-cloudwatch
  replicas: {{ .Values.cloudwatch.replicas }}
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "static-log-analysis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cloudwatch
  template:
    metadata:
      labels:
        {{- include "static-log-analysis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cloudwatch
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "static-log-analysis.cloudwatchServiceAccount" . }}
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: volume-permissions
          image: {{ .Values.volumePermissions.image | quote }}
          command: ["/bin/sh", "-ec", "chown -R 10001:10001 /journal /checkpoints"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: journal
              mountPath: /journal
            - name: checkpoints
              mountPath: /checkpoints
      containers:
        - name: cloudwatch
          image: {{ include "static-log-analysis.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - cloudwatch
            - -region={{ .Values.region }}
            - -tenant-id={{ .Values.tenantID }}
            - -classification={{ .Values.classification }}
            - -redaction-policy={{ .Values.redactionPolicy }}
            - -worker-owner=$(POD_NAME)
            - -journal-dir=/var/lib/static-log-analysis/journal
            - {{ printf "-journal-max-bytes=%.0f" .Values.cloudwatch.journal.maxBytes | quote }}
            - {{ printf "-journal-min-free-bytes=%.0f" .Values.cloudwatch.journal.minFreeBytes | quote }}
            - -cloudwatch-account={{ .Values.cloudwatch.accountID }}
            - {{ printf "-cloudwatch-log-groups=%s" (include "static-log-analysis.cloudwatchGroups" .) | quote }}
            - -cloudwatch-source-instance=$(POD_NAME)
            - -cloudwatch-credential-identity={{ .Values.cloudwatch.credentialIdentity }}
            - -cloudwatch-checkpoint-dir=/var/lib/static-log-analysis/checkpoints
            - -admin-listen=0.0.0.0:9464
            {{- range .Values.cloudwatch.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AWS_REGION
              value: {{ .Values.region | quote }}
            - name: STATIC_LOG_ANALYSIS_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.dsnKey }}
          ports:
            - name: admin
              containerPort: 9464
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.cloudwatch.resources | nindent 12 }}
          volumeMounts:
            - name: journal
              mountPath: /var/lib/static-log-analysis/journal
            - name: checkpoints
              mountPath: /var/lib/static-log-analysis/checkpoints
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: journal
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.cloudwatch.journal.storageClass }}
        storageClassName: {{ .Values.cloudwatch.journal.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.cloudwatch.journal.size }}
    - metadata:
        name: checkpoints
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.cloudwatch.checkpoints.storageClass }}
        storageClassName: {{ .Values.cloudwatch.checkpoints.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.cloudwatch.checkpoints.size }}
{{- end }}
