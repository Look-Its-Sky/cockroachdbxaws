{{- if and .Values.cloudwatch.enabled .Values.cloudwatch.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "static-log-analysis.cloudwatchServiceAccount" . }}
  labels:
    {{- include "static-log-analysis.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloudwatch
  {{- with .Values.cloudwatch.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}

