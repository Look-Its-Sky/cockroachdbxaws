apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "static-log-analysis.fullname" . }}
  labels:
    {{- include "static-log-analysis.labels" . | nindent 4 }}
    app.kubernetes.io/component: analysis
spec:
  serviceName: {{ include "static-log-analysis.fullname" . }}
  replicas: {{ .Values.analysis.replicas }}
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "static-log-analysis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: analysis
  template:
    metadata:
      labels:
        {{- include "static-log-analysis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: analysis
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: journal-permissions
          image: {{ .Values.volumePermissions.image | quote }}
          command: ["/bin/sh", "-ec", "chown -R 10001:10001 /journal"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: journal
              mountPath: /journal
      containers:
        - name: analysis
          image: {{ include "static-log-analysis.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - all
            - -region={{ .Values.region }}
            - -tenant-id={{ .Values.tenantID }}
            - -classification={{ .Values.classification }}
            - -redaction-policy={{ .Values.redactionPolicy }}
            - -journal-dir=/var/lib/static-log-analysis/journal
            - {{ printf "-journal-max-bytes=%.0f" .Values.analysis.journal.maxBytes | quote }}
            - {{ printf "-journal-min-free-bytes=%.0f" .Values.analysis.journal.minFreeBytes | quote }}
            - -otlp-trust-source=mutual_tls
            - -otlp-allowed-environments={{ join "," .Values.allowedEnvironments }}
            - -otlp-allowed-services={{ join "," .Values.allowedServices }}
            - -otlp-tls-cert=/tls/tls.crt
            - -otlp-tls-key=/tls/tls.key
            - -otlp-client-ca=/tls/ca.crt
            - -otlp-grpc-listen=0.0.0.0:4317
            - -otlp-http-listen=0.0.0.0:4318
            - -admin-listen=0.0.0.0:9464
            {{- range .Values.analysis.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: STATIC_LOG_ANALYSIS_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.dsnKey }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: admin
              containerPort: 9464
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.analysis.resources | nindent 12 }}
          volumeMounts:
            - name: journal
              mountPath: /var/lib/static-log-analysis/journal
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.tls.analysisServerSecret }}
            defaultMode: 0400
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: journal
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.analysis.journal.storageClass }}
        storageClassName: {{ .Values.analysis.journal.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.analysis.journal.size }}
