apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "static-log-analysis.fullname" . }}-outbox
  labels:
    {{- include "static-log-analysis.labels" . | nindent 4 }}
    app.kubernetes.io/component: outbox
spec:
  replicas: {{ .Values.outbox.replicas }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "static-log-analysis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: outbox
  template:
    metadata:
      labels:
        {{- include "static-log-analysis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: outbox
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "static-log-analysis.outboxServiceAccount" . }}
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: outbox
          image: {{ include "static-log-analysis.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - outbox
            - -region={{ .Values.region }}
            - -tenant-id={{ .Values.tenantID }}
            - -worker-owner=$(POD_NAME)
            - -outbox-queue-url={{ .Values.outbox.queueURL }}
            - -outbox-dead-letter-queue-url={{ .Values.outbox.deadLetterQueueURL }}
            - -admin-listen=0.0.0.0:9464
            {{- range .Values.outbox.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AWS_REGION
              value: {{ .Values.region | quote }}
            - name: STATIC_LOG_ANALYSIS_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.dsnKey }}
          ports:
            - name: admin
              containerPort: 9464
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.outbox.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
