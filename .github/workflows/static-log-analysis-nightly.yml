name: static-log-analysis-nightly

# tdd-plan.md's CI gates require a nightly pass for fuzzing, restarts, and
# capacity. Those are deliberately not on the pull-request path: a fuzz run long
# enough to be worth anything is longer than a review cycle should wait, and a
# short one is a gate in name only.

on:
  schedule:
    # 03:00 UTC daily.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "How long to run each fuzz target"
        required: false
        default: "5m"

defaults:
  run:
    working-directory: services/static-log-analysis

jobs:
  # Every fuzz target gets its own runner so one failure does not hide the
  # others and so each gets the whole budget rather than a share of it.
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/redact
            target: FuzzRedactedTextNeverContainsAConfiguredForbiddenValue
          - package: ./internal/redact
            target: FuzzSafeTextIsAlwaysAcceptedByTheValidatorThatGuardsPersistence
          - package: ./internal/redact
            target: FuzzRedactionIsIdempotent
          - package: ./internal/redact
            target: FuzzStructuredTextNeverLeaksThroughAStructuredBody
          - package: ./internal/redact
            target: FuzzFieldNameClassificationAgreesWithItsOwnValidator
          - package: ./internal/redact
            target: FuzzStructuredJSONShapeIsTotal
          - package: ./internal/admission
            target: FuzzDecodeIsTotalAndNeverExceedsItsLimits
          - package: ./internal/admission
            target: FuzzDecodeNeverAcceptsMoreRecordsThanConfigured
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/static-log-analysis/go.mod
          cache-dependency-path: services/static-log-analysis/go.sum

      - name: Fuzz ${{ matrix.target }}
        run: |
          go test -run '^$' -fuzz '^${{ matrix.target }}$' \
            -fuzztime='${{ inputs.fuzztime || '5m' }}' '${{ matrix.package }}'

      - name: Preserve the failing input
        # A crasher is written next to the target as a testdata seed. It is the
        # whole value of the run, so it is uploaded rather than discarded with
        # the runner.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crasher-${{ matrix.target }}
          path: services/static-log-analysis/**/testdata/fuzz/**
          if-no-files-found: ignore

  # The same storage and concurrency gate the pull-request workflow runs, but
  # repeated. A race that reproduces one time in twenty is invisible to a single
  # run and is exactly what -count is for.
  repeated-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/static-log-analysis/go.mod
          cache-dependency-path: services/static-log-analysis/go.sum

      - name: Test with race detector, repeated
        env:
          REQUIRE_DOCKER: "1"
        # -p 1 for the same reason the pull-request job uses it: each test binary
        # starts its own CockroachDB container, and several at once under -race
        # has already killed one mid-run.
        run: go test -p 1 -count=3 -race -tags=integration -timeout=90m ./...
